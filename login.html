
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BioLearn | Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f7f3;
      margin: 0;
      padding: 24px;
    }
    .card {
      max-width: 400px;
      margin: 40px auto;
      padding: 24px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 18px #0001;
    }
    h1 { color: #16835b; text-align: center; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 7px;
    }
    input { border: 1px solid #ccc; }
    button {
      background: #16835b;
      color: white;
      border: 0;
      cursor: pointer;
    }
    a { color: #16835b; }
    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Welcome Back</h1>
    <p>Log in to your BioLearn account.</p>

    <form id="loginForm">
      <input id="email" type="email"
        placeholder="Email address" required>

      <input id="password" type="password"
        placeholder="Password" required>

      <button type="submit">Log In</button>
    </form>

    <p id="message" role="status"></p>
    <p>New student? <a href="register.html">Create an account</a></p>
    <p><a href="index.html">Back to BioLearn</a></p>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
